services:
  postgres:
    image: postgres:16-alpine
    container_name: confectionery_postgres
    environment:
      POSTGRES_USER: confectioner
      POSTGRES_PASSWORD: secret_password
      POSTGRES_DB: confectionery_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U confectioner -d confectionery_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: confectionery_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: